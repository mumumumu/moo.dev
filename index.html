<html>
  <head>
    <style>
      body {
        background-color: black;
      }

      div {
        color: white;
        font-size: 256px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        animation: shiftLeft 0.8s ease-out 2s forwards;
      }

      .smiley {
        opacity: 0;
        margin-left: 0;
        margin-right: -200px;
        transform: translateX(-80px);
        animation: slideIn 0.8s ease-out 2s forwards;
      }

      @keyframes slideIn {
        to {
          opacity: 1;
          margin-left: 30px;
          margin-right: 0;
          transform: translateX(0);
        }
      }

      @keyframes shiftLeft {
        to {
          transform: translateX(-40px);
        }
      }
    </style>
  </head>
  <body>
    <div>hi <span class="smiley">(´• ω •`)</span></div>
  </body>
</html>
