<html>
  <head>
    <style>
      body {
        background-color: black;
      }

      div {
        color: white;
        font-size: 256px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }

      .smiley {
        opacity: 0;
        animation: fadeIn 1s ease-in 2s forwards;
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div>hi <span class="smiley">:)</span></div>
  </body>
</html>
