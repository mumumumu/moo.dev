<html>
  <head>
    <style>
      body {
        background-color: black;
      }

      div {
        color: white;
        font-size: 256px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }

      .smiley {
        opacity: 0;
        transform: translateX(-50px);
        animation: slideIn 0.8s ease-out 2s forwards;
      }

      @keyframes slideIn {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div>hi <span class="smiley">:)</span></div>
  </body>
</html>
